name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Harbour and compile eshop
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: harbour-eshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Server starts and answers
        run: |
          docker run -d --name eshop -p 8002:8002 harbour-eshop:ci
          for _ in $(seq 1 30); do
            curl -skf https://localhost:8002/hello && exit 0
            sleep 1
          done
          docker logs eshop
          exit 1

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - run: cargo build --locked --manifest-path gateway/Cargo.toml --release
      - run: cargo test --locked --manifest-path gateway/Cargo.toml
      - run: cargo fmt --manifest-path gateway/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path gateway/Cargo.toml --all-targets -- -D warnings
      - run: docker build -t harbour-eshop:gateway-test .
      - run: docker build -t harbour-eshop-gateway:gateway-test -f gateway/Dockerfile gateway
      - run: python3 migration/verify.py --binary gateway/target/release/eshop-gateway --legacy-image harbour-eshop:gateway-test --gateway-image harbour-eshop-gateway:gateway-test
