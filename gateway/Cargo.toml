[package]
name = "harbour-eshop-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.10.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-rustls = { version = "0.27.5", features = ["http1", "tls12"] }
hyper-util = { version = "0.1.10", features = ["client-legacy", "http1", "server-auto", "tokio"] }
pin-project-lite = "0.2.16"
rustls = "0.23.23"
rustls-pemfile = "2.2.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
uuid = { version = "1.12.1", features = ["v4"] }
